name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          # External sites sometimes block requests from GitHub runners. Keep
          # reporting those results without failing an otherwise valid build.
          fail: false
          args: >-
            --verbose
            --no-progress
            --timeout 30
            --max-retries 3
            --exclude-path _site
            --exclude-path README.md
            --exclude-path _pages/404.md
            --exclude-path _pages/about_einstein.md
            --exclude-path _pages/blog.md
            --exclude-path _pages/misc.md
            --exclude-path _posts/2018-12-22-distill.md
            --exclude-path assets/plotly/demo.html
            --exclude 'dl\.acm\.org'
            --exclude 'doi\.org/10\.1145'
            --exclude 'vimeo\.com'
            --exclude 'www\.informatics\.uci\.edu'
            --exclude 'example\.com'
            './**/*.md'
            './**/*.html'
